[project]
name = "cap-931"
version = "0.1.0"
description = "AI Sales Assistant Agent: researches a prospect's website, news and SEC 10-K filing, then produces a one-page account brief in the PerScholas Word template."
readme = "README.md"
authors = [
    { name = "Nirmala-SK", email = "nirmala.sendil@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "openai>=3.31.0",
    "pypdf>=6.21.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-pptx>=1.0.2",
    "requests>=2.34.2",
    "streamlit>=1.66.0",
]

[project.scripts]
cap-931 = "cap_931.main:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
